name: LeetCode Sync

on:
  schedule:
    - cron: "17 3 * * *"   # daily at 03:17 UTC; edit to taste
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Re-scan the entire submission history (use for the first run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: leetcode-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync accepted Java submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          FULL_SYNC: ${{ github.event.inputs.full_sync == 'true' && 'true' || 'false' }}
          ARCHIVE_ALL_ACCEPTED: "true"   # set "false" to keep only the latest Solution.java
          CREATE_MAIN_STUB: "true"       # only ever creates a missing Main.java
        run: python scripts/leetcode_sync.py

      - name: Safety check - Main.java must be untouched
        run: |
          if git diff --name-only --diff-filter=MDR HEAD | grep -E '(^|/)Main\.java$'; then
            echo "::error::An existing Main.java was modified. Aborting without commit."
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "Rishabh"
          git config user.email "174471886+Rishp-3@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(sync): update LeetCode solutions"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
