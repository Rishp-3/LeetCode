
name: Sync LeetCode submissions

on:
  schedule:
    # Run every 6 hours (UTC)
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leetcode-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync accepted Java solutions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "requests>=2.32.0,<3.0.0"

      - name: Validate configuration
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: |
          if [ -z "$LEETCODE_SESSION" ]; then
            echo "::error::LEETCODE_SESSION secret is missing."
            exit 1
          fi

          if [ ! -f scripts/sync_leetcode.py ]; then
            echo "::error::scripts/sync_leetcode.py not found."
            exit 1
          fi

          echo "Configuration validation passed."

      - name: Sync accepted Java solutions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          LEETCODE_USERNAME: rishp_3
        run: python scripts/sync_leetcode.py

      - name: Commit and push changes
        run: |
          git add -- Easy Medium Hard

          if git diff --cached --quiet; then
            echo "No solution changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: sync accepted LeetCode solutions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
